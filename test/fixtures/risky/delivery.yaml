# bob may only roll out existing Deployments in namespace delivery. patch is
# enough to point one at the pipeline ServiceAccount, which can request tokens
# for the cluster operator in namespace infra. bob is two steps from
# cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout
  namespace: delivery
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bob-rollout
  namespace: delivery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout
subjects:
  - kind: User
    name: bob@example.com
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: delivery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-token
  namespace: infra
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["cluster-operator"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-operator-token
  namespace: infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-token
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: delivery
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-operator
  namespace: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: cluster-operator
    namespace: infra
